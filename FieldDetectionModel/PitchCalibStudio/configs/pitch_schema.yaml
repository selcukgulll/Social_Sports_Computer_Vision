# Rocktail keypoints-86lcy veri setinin 0..21 indeks düzeni ortak hedef
# şema olarak kullanılır. 0..21 aralığı toplam 22 keypoint demektir.
#
# Koordinatlar Rocktail etiketlerinin çoklu kare geometrisinden doğrulandı.
# Dört dış köşe birim dikdörtgene sabitlenerek yapılan bağımsız kontrolde
# medyan izdüşüm hatası yaklaşık 2 px'tir.
schema_name: rocktail_futsal_pitch_22
status: verified_from_dataset_previews
canonical_source: keypoints.v1i.yolov8
coordinate_system:
  description: Normalized futsal field coordinates
  x: 0.0 left goal line, 1.0 right goal line
  y: 0.0 top sideline, 1.0 bottom sideline
pitch_length_m: 40.0
pitch_width_m: 20.0
keypoints:
  0:
    name: left_top_corner
    field_xy: [0.0, 0.0]
  1:
    name: left_penalty_area_goal_line_top
    field_xy: [0.0, 0.25]
  2:
    name: left_goal_post_top
    field_xy: [0.0, 0.425]
  3:
    name: left_goal_post_bottom
    field_xy: [0.0, 0.575]
  4:
